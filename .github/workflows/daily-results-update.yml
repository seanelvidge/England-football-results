name: Nightly Football-Data Consistency Check

on:
  schedule:
    # Aim for just after midnight UK time, avoiding GitHub's busy top of the hour.
    # Scheduled triggers are best effort and can still be delayed.
    - cron: '17 0 * * *'
      timezone: 'Europe/London'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-results-database
  cancel-in-progress: false

jobs:
  check-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: .github/workflows/requirements.txt

      - name: Install dependencies
        run: pip install -r .github/workflows/requirements.txt

      - name: Check results import and rankings
        run: python -m unittest discover -s .github/tests

      - name: Verify published results against the database
        run: python .github/workflows/bbc_results.py --root-dir "$GITHUB_WORKSPACE" --check-football-data

      - name: Verify SQLite and Parquet against the CSV datasets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python .github/workflows/release_formats.py check --root-dir "$GITHUB_WORKSPACE"
