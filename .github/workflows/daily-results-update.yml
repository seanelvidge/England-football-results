name: Daily Football Results Update

on:
  schedule:
    # Aim for just after midnight UK time, avoiding GitHub's busy top of the hour.
    # Scheduled triggers are best effort and can still be delayed.
    - cron: '17 0 * * *'
      timezone: 'Europe/London'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-football-results-update
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r .github/workflows/requirements.txt

      - name: Check rating mathematics
        run: python -m unittest discover -s tests

      - name: Update results database
        run: python .github/workflows/football_results.py --root-dir "$GITHUB_WORKSPACE" --rankings-state ".github/rankings.csv"

      - name: Commit and push changed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md EnglandLeagueResults.csv EnglandLeagueResults_wRanks.csv .github/rankings.csv .github/rankings.csv.meta.json football_model.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          current_date="$(date +'%Y/%m/%d')"
          git commit -m "Updated results on ${current_date}"
          git push
